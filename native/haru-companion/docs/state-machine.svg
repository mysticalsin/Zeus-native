<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="Haru session state machine">
<title>Haru session state machine</title>
<desc>Legal edges come from SessionState::next. The dot walks idle, starting, streaming, closing, closed.</desc>
<style>text { font-family: ui-sans-serif, system-ui, sans-serif; }</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#44403c"/></marker></defs>
<rect width="640" height="340" fill="#fafaf9"/>
<line x1="490" y1="230" x2="280" y2="230" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="385" y="212" text-anchor="middle" font-size="11" fill="#44403c">closed</text><line x1="490" y1="230" x2="90" y2="230" stroke="#9a3412" stroke-width="1.4" marker-end="url(#arrow)"/><text x="290" y="194" text-anchor="middle" font-size="11" fill="#9a3412">fail(socket_closed)</text><line x1="90" y1="70" x2="280" y2="230" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="173" y="164" text-anchor="middle" font-size="11" fill="#44403c">close</text><line x1="90" y1="70" x2="90" y2="230" stroke="#9a3412" stroke-width="1.4" marker-end="url(#arrow)"/><text x="72" y="150" text-anchor="middle" font-size="11" fill="#9a3412">fail(socket_closed)</text><line x1="90" y1="70" x2="280" y2="70" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="185" y="52" text-anchor="middle" font-size="11" fill="#44403c">start</text><line x1="280" y1="70" x2="490" y2="230" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="374" y="164" text-anchor="middle" font-size="11" fill="#44403c">close</text><line x1="280" y1="70" x2="90" y2="230" stroke="#9a3412" stroke-width="1.4" marker-end="url(#arrow)"/><text x="173" y="136" text-anchor="middle" font-size="11" fill="#9a3412">fail(socket_closed)</text><line x1="280" y1="70" x2="490" y2="70" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="385" y="52" text-anchor="middle" font-size="11" fill="#44403c">started</text><line x1="490" y1="70" x2="490" y2="230" stroke="#44403c" stroke-width="1.4" marker-end="url(#arrow)"/><text x="472" y="150" text-anchor="middle" font-size="11" fill="#44403c">close</text><line x1="490" y1="70" x2="90" y2="230" stroke="#9a3412" stroke-width="1.4" marker-end="url(#arrow)"/><text x="283" y="133" text-anchor="middle" font-size="11" fill="#9a3412">fail(socket_closed)</text><path d="M 490 70 m 28 -18 a 18 18 0 1 1 -1 0" fill="none" stroke="#44403c" stroke-width="1.4"/><text x="490" y="24" text-anchor="middle" font-size="11" fill="#44403c">push</text>
<g><rect x="30" y="52" width="120" height="36" rx="8" fill="#fff7ed" stroke="#292524"/><text x="90" y="75" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">idle</text></g><g><rect x="220" y="52" width="120" height="36" rx="8" fill="#fff7ed" stroke="#292524"/><text x="280" y="75" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">starting</text></g><g><rect x="430" y="52" width="120" height="36" rx="8" fill="#fff7ed" stroke="#292524"/><text x="490" y="75" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">streaming</text></g><g><rect x="430" y="212" width="120" height="36" rx="8" fill="#fff7ed" stroke="#292524"/><text x="490" y="235" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">closing</text></g><g><rect x="220" y="212" width="120" height="36" rx="8" fill="#e7e5e4" stroke="#292524"/><text x="280" y="235" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">closed</text></g><g><rect x="30" y="212" width="120" height="36" rx="8" fill="#e7e5e4" stroke="#292524"/><text x="90" y="235" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#1c1917">failed</text></g>
<circle r="5" fill="#c2410c"><animateMotion dur="8s" repeatCount="indefinite" path="M 90 98 L 280 98 L 490 98 L 490 258 L 280 258"/></circle>
</svg>
