<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">Stream per-frame latency, Python, Rust, and Go</title>
  <desc id="desc">Medians from pipeline-bench/results/summary.json. Python p50 0.124581 ms, Rust p50 0.018127499999999998 ms, Go p50 0.035847 ms.</desc>
  <style>
    .bar-py { animation: grow-py 1.4s linear forwards; }
    .bar-rs { animation: grow-rs 1.4s linear forwards; }
    .bar-go { animation: grow-go 1.4s linear forwards; }
    .tick { animation: tick-in 0.3s linear 1.2s both; }
    @keyframes grow-py { from { width: 0px; } to { width: 248.1px; } }
    @keyframes grow-rs { from { width: 0px; } to { width: 36.1px; } }
    @keyframes grow-go { from { width: 0px; } to { width: 71.4px; } }
    @keyframes tick-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bar-py, .bar-rs, .bar-go, .tick { animation: none; }
    }
  </style>
  <rect width="640" height="280" fill="#f6f4ef"/>
  <text x="24" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#1c1917">Stream path, per frame</text>
  <text x="24" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">summary.json medians of 7 runs. Bars grow to p50; the tick is p95.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c1917">
    <text x="24" y="92">Python</text>
    <text x="24" y="148">Rust</text>
    <text x="24" y="204">Go</text>
  </g>
  <g transform="translate(100,72)">
    <rect class="bar-py" width="248.1" height="18" fill="#b45309"/>
    <line class="tick" x1="320" y1="-4" x2="320" y2="22" stroke="#1c1917" stroke-width="2"/>
    <text x="328" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">p50 0.124581 ms · p95 0.160699 ms</text>
  </g>
  <g transform="translate(100,128)">
    <rect class="bar-rs" width="36.1" height="18" fill="#0f766e"/>
    <line class="tick" x1="42.8" y1="-4" x2="42.8" y2="22" stroke="#1c1917" stroke-width="2"/>
    <text x="52" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">p50 0.018127499999999998 ms · p95 0.02150425 ms</text>
  </g>
  <g transform="translate(100,184)">
    <rect class="bar-go" width="71.4" height="18" fill="#1d4ed8"/>
    <line class="tick" x1="88.1" y1="-4" x2="88.1" y2="22" stroke="#1c1917" stroke-width="2"/>
    <text x="98" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">p50 0.035847 ms · p95 0.044256149999999994 ms</text>
  </g>
  <text x="24" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Scale: 320 px = Python p95 0.160699 ms. Source: pipeline-bench/results/summary.json.</text>
</svg>
