<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck notes in the top bar</title>
  <style>
    :root {
      --panel: #0e1116;
      --ink: #e9edf2;
      --secondary: #a3adb8;
      --quiet: #8a94a0;
      --notes: #e7e1d6;
      --pill: #353537;
      --hair: rgba(255, 255, 255, 0.16);
      --rim: rgba(255, 255, 255, 0.1);
      --sans: ui-sans-serif, system-ui, sans-serif;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050607;
      color: var(--quiet);
      font-family: var(--sans);
    }

    main {
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header h1 {
      margin: 0 0 8px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0 0 36px;
      max-width: 62ch;
      font-size: 14px;
      line-height: 1.5;
    }

    figure { margin: 0 0 42px; }

    figcaption {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .screen {
      background: #090b0e;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      overflow: hidden;
    }

    .menu {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: rgba(233, 237, 242, 0.72);
      font-size: 12px;
    }

    .bar {
      width: 870px;
      max-width: calc(100% - 36px);
      margin: 0 auto 22px;
      background: var(--panel);
      border: 1px solid var(--rim);
      border-top: 0;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .notch-row {
      height: 38px;
      display: flex;
      justify-content: center;
    }

    .notch {
      width: 185px;
      height: 32px;
      background: #000;
      border-radius: 0 0 12px 12px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px 0 24px;
      height: 34px;
    }

    .capsule {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 34px;
      padding: 3px 5px;
      background: #000;
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(255, 255, 255, 0.07);
    }

    .icon, .pill {
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.78);
    }

    .icon { width: 35px; }

    .pill {
      min-width: 82px;
      padding: 0 12px;
      gap: 7px;
      color: #fff;
      background: var(--pill);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.21);
      font-size: 12.5px;
      font-weight: 600;
    }

    .more {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #000;
      color: rgba(255, 255, 255, 0.85);
      display: grid;
      place-items: center;
      letter-spacing: 0.12em;
      font-size: 12px;
    }

    .page {
      height: 236px;
      margin: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .kicker {
      margin: 0;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .position {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-top: 8px;
    }

    .fraction {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .deck {
      color: var(--secondary);
      font-size: 13px;
    }

    .rule {
      height: 1px;
      margin: 12px 0;
      background: var(--hair);
    }

    .notes {
      margin: 0;
      max-width: 62ch;
      color: var(--notes);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.45;
      font-weight: 400;
    }

    .failure-title {
      margin: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
    }

    .local {
      margin: 10px 0 0;
      color: var(--quiet);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .button {
      height: 28px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--hair);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      line-height: 26px;
    }

    .button.primary {
      background: var(--ink);
      color: var(--panel);
      border-color: var(--ink);
    }

    svg { display: block; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Deck notes in the top bar</h1>
      <p>The open top bar, Prompter selected. The notes sit in the page under the tabs. There is no separate window.</p>
    </header>

    <figure>
      <figcaption>Showing</figcaption>
      <div class="screen">
        <div class="menu"><span>Zeus</span><span>9:41</span></div>
        <div class="bar" aria-hidden="true">
          <div class="notch-row"><div class="notch"></div></div>
          <div class="tabs">
            <div class="capsule">
              <span class="icon" title="Home"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="7.5" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="1" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="7.5" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor"/></svg></span>
              <span class="icon" title="Tiling"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="5" height="11" rx="1" stroke="currentColor"/><rect x="7" y="1" width="5" height="5" rx="1" stroke="currentColor"/><rect x="7" y="7" width="5" height="5" rx="1" stroke="currentColor"/></svg></span>
              <span class="icon" title="Agents"><svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M7.1 1.2 3.2 7.1h2.4L5.4 11.8 9.8 5.6H7.3L7.1 1.2z"/></svg></span>
              <span class="icon" title="Chat"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 2.5h9v6.2H6.2L3.4 11V8.7H2V2.5z" stroke="currentColor" stroke-linejoin="round"/></svg></span>
              <span class="pill">Prompter</span>
            </div>
            <div class="more" title="More">···</div>
          </div>
          <div class="page">
            <p class="kicker">Speaker notes</p>
            <div class="position">
              <div class="fraction">04 / 18</div>
              <div class="deck">Quarterly review</div>
            </div>
            <div class="rule"></div>
            <p class="notes">Open on the quarter, then the two numbers. Pause after the second. If they ask about the hiring plan, it is on the next slide. Leave the chart up while you answer.</p>
            <p class="local">On this Mac. Cleared when you leave.</p>
            <div class="actions">
              <div class="button primary">Read again</div>
              <div class="button">Follow</div>
              <div class="button">Clear</div>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <figure>
      <figcaption>Notes are not on this page</figcaption>
      <div class="screen">
        <div class="menu"><span>Zeus</span><span>9:41</span></div>
        <div class="bar" aria-hidden="true">
          <div class="notch-row"><div class="notch"></div></div>
          <div class="tabs">
            <div class="capsule">
              <span class="icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="7.5" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="1" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor"/><rect x="7.5" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor"/></svg></span>
              <span class="icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="5" height="11" rx="1" stroke="currentColor"/><rect x="7" y="1" width="5" height="5" rx="1" stroke="currentColor"/><rect x="7" y="7" width="5" height="5" rx="1" stroke="currentColor"/></svg></span>
              <span class="icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M7.1 1.2 3.2 7.1h2.4L5.4 11.8 9.8 5.6H7.3L7.1 1.2z"/></svg></span>
              <span class="icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 2.5h9v6.2H6.2L3.4 11V8.7H2V2.5z" stroke="currentColor" stroke-linejoin="round"/></svg></span>
              <span class="pill">Prompter</span>
            </div>
            <div class="more">···</div>
          </div>
          <div class="page">
            <p class="kicker">Speaker notes</p>
            <div class="position">
              <div class="fraction">04 / 18</div>
              <div class="deck">Quarterly review</div>
            </div>
            <div class="rule"></div>
            <h2 class="failure-title">Notes are not on this page</h2>
            <p class="notes">Open the speaker notes in the browser, then press Read.</p>
            <div class="actions">
              <div class="button primary">Read again</div>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </main>
</body>
</html>
