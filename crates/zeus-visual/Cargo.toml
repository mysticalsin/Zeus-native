[package]
name = "zeus-visual"
version = "0.1.0"
edition = "2021"
description = "Pointing, companion flight, and explain-frame math for the Zeus Mac app."
license = "MIT"

[lib]
name = "zeus_visual"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

# The Mac app links this archive from Swift. Unwind would leave rust_eh_personality undefined.
[profile.release]
panic = "abort"
