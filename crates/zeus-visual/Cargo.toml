[package]
name = "zeus-visual"
version = "0.1.0"
edition = "2021"
description = "Pointing, companion flight, and explain-frame math for the Zeus Mac app."
license = "MIT"

[lib]
name = "zeus_visual"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

# The Mac app links this archive from Swift, next to FluidAudio's Rust archive.
# Abort keeps unwind out of the link. The personality stub is still defined and is
# renamed by tools/hide-visual-personality.sh so the two archives do not collide.
[profile.release]
panic = "abort"
