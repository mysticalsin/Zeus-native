name: Python launcher diagnostic

on:
  push:
    paths:
      - .github/workflows/python-launch-diagnostic.yml
      - qa/python_launcher_diagnostic.py
  pull_request:
    paths:
      - .github/workflows/python-launch-diagnostic.yml
      - qa/python_launcher_diagnostic.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-entry:
    name: First Python entry (${{ matrix.variant }})
    runs-on: macos-15
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        # A distinct fresh hosted runner for each literal target. No warm retries.
        variant: [system-launcher, xcode-direct]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ZEUS_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare incomplete diagnostic receipt
        shell: bash
        run: |
          diagnostic_output="$RUNNER_TEMP/python-launch-${{ matrix.variant }}"
          mkdir -p "$diagnostic_output"
          printf '%s\n' '{"diagnostic_only":true,"status":"incomplete","attempts":0,"reason":"measurement has not run"}' > "$diagnostic_output/measurement.json"
      - name: Select Xcode without resolving a Python target
        shell: bash
        run: |
          diagnostic_output="$RUNNER_TEMP/python-launch-${{ matrix.variant }}"
          sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR" > "$diagnostic_output/xcode-selection.log" 2>&1
      - name: Measure first target launch with independent Homebrew driver
        timeout-minutes: 1
        shell: bash
        run: |
          diagnostic_output="$RUNNER_TEMP/python-launch-${{ matrix.variant }}"
          if [[ ! -x /opt/homebrew/bin/python3 ]]; then
            printf '%s\n' '{"diagnostic_only":true,"status":"failed","attempts":0,"failure":"explicit Homebrew driver unavailable; no substitute used"}' > "$diagnostic_output/measurement.json"
            exit 1
          fi
          /opt/homebrew/bin/python3 -I -S qa/python_launcher_diagnostic.py --variant "${{ matrix.variant }}" --output "$diagnostic_output"
      - name: Check diagnostic deadline and failure contracts after measurement
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          diagnostic_output="$RUNNER_TEMP/python-launch-${{ matrix.variant }}"
          mkdir -p "$diagnostic_output"
          set -o pipefail
          /opt/homebrew/bin/python3 -I -S qa/python_launcher_diagnostic.py --self-test 2>&1 | tee "$diagnostic_output/driver-self-test.log"
      - name: Upload diagnostic evidence even on timeout or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-first-entry-${{ matrix.variant }}
          path: ${{ runner.temp }}/python-launch-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
